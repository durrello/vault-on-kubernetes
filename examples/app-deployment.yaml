apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-demo-app
  namespace: default
  labels:
    app: vault-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-demo-app
  template:
    metadata:
      labels:
        app: vault-demo-app
      annotations:
        # Vault Agent Injector pulls the secret into the pod at /vault/secrets/config
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "app"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/app/config"
    spec:
      serviceAccountName: app-sa
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
